name = "brs"
grammar = "brs"
path_suffixes = ["brs"]
line_comments = ["// ", "/// ", "//! "]
block_comment = { start = "/*", end = "*/" }
tab_size = 4
hard_tabs = false
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
decrease_indent_patterns = [
    { pattern = "^\\s*[}\\])]" },
]
