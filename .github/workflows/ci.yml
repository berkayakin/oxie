name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # the expected-output files must keep their \n line endings on Windows
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast

  # The oldest Rust that Oxie supports (rust-version in Cargo.toml). The e2e programs aren't
  # run here: some use tokio, whose current release needs a newer Rust.
  msrv:
    name: Rust 1.82
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p oxie-compiler -p oxie-build -p oxie-from-rust -p oxie --lib --bins --test lsp --test golden

  # The VS Code extension: grammar tests, the integration tests in VS Code with this checkout's
  # `oxie` (including a cargo check), and the .vsix package.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/vscode-oxie
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p oxie
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode-oxie/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:grammar
      - run: xvfb-run -a npm run test:integration
        env:
          OXIE_PATH: ../../target/debug/oxie
          OXIE_HOME: ${{ github.workspace }}
          OXIE_TEST_CARGO_CHECK: "1"
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-oxie
          path: editors/vscode-oxie/*.vsix
